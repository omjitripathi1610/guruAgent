<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password — GuruAgent</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="forgot-password.css">
    <!-- Supabase Official CDN Library -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- Apni Config File -->
    <script src="supabase-client.js"></script>
</head>
<body>

    <div class="forgot-wrapper">
        <div class="forgot-card">
            
            <!-- Header / Logo -->
            <div class="forgot-header">
                <a href="index.html" class="logo-group">
                    <div class="logo-box">G</div>
                    <div class="logo-text">
                        <span class="logo-title">GuruAgent</span>
                        <span class="logo-subtitle">IKS Adaptive AI</span>
                    </div>
                </a>
                <h1 class="auth-title">Reset Password</h1>
                <p class="auth-subtitle">Enter your email address to receive a password reset link</p>
            </div>

            <!-- Forgot Password Form -->
            <form id="forgot-form" novalidate>
                
                <!-- Email Address -->
                <div class="form-group">
                    <label for="email">Registered Email</label>
                    <div class="input-wrapper">
                        <i data-lucide="mail" class="input-icon"></i>
                        <input type="email" id="email" placeholder="name@example.com" required>
                    </div>
                    <span class="error-msg" id="email-error">Please enter a valid email address</span>
                </div>

                <!-- Submit Button -->
                <button type="submit" id="submit-btn" class="btn-reset-submit">
                    <span id="btn-text">Send Reset Link</span>
                    <i data-lucide="send" class="btn-icon"></i>
                </button>

            </form>

            <!-- Success Message Box (Hidden by default) -->
            <div id="success-box" class="success-box hidden">
                <div class="success-icon-box">
                    <i data-lucide="check-circle-2"></i>
                </div>
                <h3>Reset Link Sent!</h3>
                <p>We've sent a password reset link to <strong id="sent-email-text">your email</strong>. Please check your inbox.</p>
                <button id="resend-btn" class="btn-resend">Resend Email</button>
            </div>

            <!-- Footer Link -->
            <div class="forgot-footer">
                <p>Remember your password? <a href="login.html" class="auth-link">Log In</a></p>
            </div>

        </div>
    </div>

    <script src="forgot-password.js"></script>
    <script>
        lucide.createIcons();
    </script>
</body>
</html>
