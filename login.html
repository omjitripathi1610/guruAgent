<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — GuruAgent</title>
  <link rel="stylesheet" href="login.css">
  <!-- Font Awesome Icons -->
  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Supabase Official CDN Library -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- Apni Config File -->
  <script src="supabase-client.js"></script>  

</head>
<body>

  <!-- Background Decorative Spheres -->
  <div class="bg-glow glow-1"></div>
  <div class="bg-glow glow-2"></div>

  <main class="login-container">
    <div class="login-card">
      
      <!-- Brand Logo Header -->
      <div class="brand-header">
        <div class="logo">
          <span class="logo-icon">G</span>
          <span class="logo-text">GuruAgent</span>
        </div>
        <h2>Welcome Back!</h2>
        <p>Please enter your credentials to access your account.</p>
      </div>

      <!-- Login Form -->
      <form id="loginForm" novalidate>
        
        <!-- Email / Phone Input Group -->
        <div class="input-group">
          <label for="loginInput">Email Address or Phone Number</label>
          <div class="input-wrapper">
            <i class="fa-regular fa-user input-icon"></i>
            <input type="text" id="loginInput" placeholder="Enter your email or phone number" required>
          </div>
          <span class="error-msg" id="loginInputError">Please enter a valid email or phone number</span>
        </div>

        <!-- Password Input Group -->
        <div class="input-group">
          <div class="label-row">
            <label for="password">Password</label>
            <a href="forgot-password.html" class="forgot-pass">Forgot Password?</a>
          </div>
          <div class="input-wrapper">
            <i class="fa-solid fa-lock input-icon"></i>
            <input type="password" id="password" placeholder="••••••••" required>
            <i class="fa-regular fa-eye toggle-password" id="togglePassword"></i>
          </div>
          <span class="error-msg" id="passwordError">Password must be at least 6 characters</span>
        </div>

        <!-- Remember Me Checkbox -->
        <div class="options-row">
          <label class="remember-me">
            <input type="checkbox" id="remember">
            <span class="checkmark"></span>
            Remember me
          </label>
        </div>

        <!-- Submit Button -->
        <button type="submit" class="btn-submit" id="submitBtn">
          <span>Log In</span>
          <i class="fa-solid fa-arrow-right icon-arrow"></i>
        </button>

      </form>

      <!-- Footer Link -->
      <div class="card-footer">
        Don't have an account? <a href="signup.html">Create a new account</a>
      </div>

    </div>
  </main>

  <script src="login.js"></script>
</body>
</html>
