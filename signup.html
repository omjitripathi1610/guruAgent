<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up — GuruAgent</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="signup.css">
    <!-- Supabase Official CDN Library -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- Apni Config File -->
    <script src="supabase-client.js"></script>
</head>
<body>

    <div class="signup-wrapper">
        <div class="signup-card">
            
            <!-- Header / Logo -->
            <div class="signup-header">
                <a href="index.html" class="logo-group">
                    <div class="logo-box">G</div>
                    <div class="logo-text">
                        <span class="logo-title">GuruAgent</span>
                        <span class="logo-subtitle">IKS Adaptive AI</span>
                    </div>
                </a>
                <h1 class="auth-title">Create Account</h1>
                <p class="auth-subtitle">Join GuruAgent to start your personalized learning journey</p>
            </div>

            <!-- Signup Form -->
            <form id="signup-form" novalidate>
                
                <!-- Full Name -->
                <div class="form-group">
                    <label for="fullname">Full Name</label>
                    <div class="input-wrapper">
                        <i data-lucide="user" class="input-icon"></i>
                        <input type="text" id="fullname" placeholder="Enter your full name" required>
                    </div>
                    <span class="error-msg" id="fullname-error">Please enter your full name</span>
                </div>

                <!-- Email Address -->
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <div class="input-wrapper">
                        <i data-lucide="mail" class="input-icon"></i>
                        <input type="email" id="email" placeholder="name@example.com" required>
                    </div>
                    <span class="error-msg" id="email-error">Please enter a valid email address</span>
                </div>

                <!-- Phone Number -->
                <div class="form-group">
                    <label for="phone">Phone Number</label>
                    <div class="input-wrapper">
                        <i data-lucide="phone" class="input-icon"></i>
                        <input type="tel" id="phone" placeholder="Enter a valid phone number" required>
                    </div>
                    <span class="error-msg" id="phone-error">Please enter a valid phone number</span>
                </div>

                <!-- Password -->
                <div class="form-group">
                    <label for="password">Password</label>
                    <div class="input-wrapper">
                        <i data-lucide="lock" class="input-icon"></i>
                        <input type="password" id="password" placeholder="••••••••" required>
                        <button type="button" id="toggle-password" class="toggle-pwd-btn" aria-label="Toggle password visibility">
                            <i data-lucide="eye" id="eye-icon"></i>
                        </button>
                    </div>
                    <span class="error-msg" id="password-error">Password must be at least 6 characters</span>
                </div>

                <!-- Submit Button -->
                <button type="submit" id="submit-btn" class="btn-signup-submit">
                    <span id="btn-text">Create Account</span>
                    <i data-lucide="arrow-right" class="btn-icon"></i>
                </button>

            </form>

            <!-- Footer Link -->
            <div class="signup-footer">
                <p>Already have an account? <a href="login.html" class="auth-link">Log In</a></p>
            </div>

        </div>
    </div>

    <script src="signup.js"></script>
    <script>
        lucide.createIcons();
    </script>
</body>
</html>
